# Every pull request and push: typecheck, unit tests and a production build. Vercel deploys on its own.
name: CI
on:
  pull_request:
  push:
    branches: [develop, uat, main]
jobs:
  web:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
        env:
          ISQUIZ_API_URL: http://localhost:8100
